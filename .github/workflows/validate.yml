name: Validate

on:
  push:
  pull_request:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  regressions:
    name: Simulated-device regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [hacs, hassfest, regressions]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4
      - name: Publish version from manifest
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('custom_components/nanoleaf_panels/manifest.json', 'utf8'));
            const version = manifest.version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error('Expected a stable semantic version in manifest.json');
            }
            const tag = 'v' + version;
            try {
              await github.rest.repos.getReleaseByTag({...context.repo, tag});
              core.info('Release ' + tag + ' already exists; nothing to publish.');
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const heading = '## ' + version + '\n';
            const start = changelog.indexOf(heading);
            if (start < 0) throw new Error('Missing changelog entry for ' + version);
            const section = changelog.slice(start + heading.length);
            const next = section.indexOf('\n## ');
            const body = (next < 0 ? section : section.slice(0, next)).trim();
            if (!body) throw new Error('Release notes must not be empty');
            try {
              const {data: ref} = await github.rest.git.getRef({...context.repo, ref: 'tags/' + tag});
              if (ref.object.type !== 'commit' || ref.object.sha !== context.sha) {
                throw new Error('Existing tag does not point at this validated commit');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const {data: release} = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              body,
              draft: false,
              prerelease: false,
              make_latest: 'true'
            });
            core.notice('Published ' + release.html_url);
